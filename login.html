<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEO-SUSU — Connexion</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-152.png">
<meta name="theme-color" content="#0a0a1a">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Syne:wght@600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --gold: #d4af37;
    --gold-light: #f4d97a;
    --void: #0a0a1a;
    --deep: #1a1a2e;
    --text: #f5f5f5;
    --text-dim: rgba(245,245,245,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(ellipse at top, var(--deep) 0%, var(--void) 70%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-container {
    width: 100%;
    max-width: 420px;
    background: rgba(26, 26, 46, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 24px;
    padding: 40px 28px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .logo-section {
    text-align: center;
    margin-bottom: 36px;
  }

  .logo-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 44px;
    font-weight: 700;
    color: var(--void);
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-dim);
  }

  .form-group { margin-bottom: 18px; }

  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(212, 175, 55, 0.15);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    transition: all 0.2s;
  }

  input:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(255,255,255,0.08);
  }

  .btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: var(--void);
    border: none;
    border-radius: 14px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    letter-spacing: 0.5px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.3); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .signup-link {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: var(--text-dim);
  }

  .signup-link a { color: var(--gold); text-decoration: none; font-weight: 600; }

  .back-link {
    display: inline-block;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 20px;
  }

  @keyframes slideDown {
    from { transform: translate(-50%, -100%); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }
</style>
</head>
<body>

<div class="login-container">
  <a href="index.html" class="back-link">← Retour</a>

  <div class="logo-section">
    <div class="logo-icon">N</div>
    <h1>Bon retour ✦</h1>
    <p class="subtitle">Connecte-toi à ton compte NEO-SUSU</p>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required placeholder="ton@email.com">
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">
      Se connecter ✦
    </button>
  </form>

  <div class="signup-link">
    Pas encore membre ? <a href="signup.html">Créer un compte</a>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Connexion...';

    const result = await signIn(
      document.getElementById('email').value,
      document.getElementById('password').value
    );

    if (!result.success) {
      btn.disabled = false;
      btn.textContent = 'Se connecter ✦';
    }
  });
</script>
</body>
</html>
