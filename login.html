<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO-SUSU — Connexion</title>
<meta name="theme-color" content="#1A1612">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<style>
  .container { max-width: 420px; }
  .logo-section { text-align: center; margin-bottom: 30px; }
  .forgot { text-align: right; margin-top: -8px; margin-bottom: 16px; }
  .forgot a { color: var(--sky); font-size: 12px; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<div class="container">
  <a href="./index.html" class="back-link">← Retour</a>

  <div class="logo-section">
    <div class="logo-icon">N</div>
    <h1 class="page-title">Connexion</h1>
    <p class="page-subtitle">Heureux de te revoir 👋</p>
  </div>

  <div class="info-box">
    🔧 <strong>Configuration en cours</strong> — La connexion sera bientôt connectée à la base de données.
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="ton@email.com" required>
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <div class="forgot"><a href="#" onclick="alert('Réinitialisation bientôt disponible'); return false;">Mot de passe oublié ?</a></div>

    <button type="submit" class="btn-submit">Se connecter ✦</button>
  </form>

  <div class="signup-link">
    Pas encore de compte ? <a href="./signup.html">Créer un compte</a>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('🔧 La connexion sera activée une fois Supabase configuré.\n\nEn attendant, tu peux utiliser le mode démo depuis l\'accueil.');
    window.location.href = './index.html';
  });
</script>
</body>
</html>
