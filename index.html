<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0B1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>NEO-SUSU — L'epargne communautaire intelligente</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --void:    #0D0B1E;
  --deep:    #131029;
  --surf:    #1A1535;
  --card:    #211B42;
  --raised:  #2A2254;
  --gold:    #D4A820;
  --gold2:   #B8860B;
  --gold-pale:#F5E09A;
  --em:      #1CC48A;
  --em2:     #0FA870;
  --sky:     #4AA8FF;
  --violet:  #9B72F5;
  --violet2: #7C5CE4;
  --red:     #E8445A;
  --text:    #F0EEFF;
  --text2:   #9B8EC4;
  --text3:   #5A4E8A;
  --stroke:  rgba(155,114,245,0.12);
  --stroke2: rgba(155,114,245,0.22);
  --ff-s: "Cormorant Garamond", serif;
  --ff-b: "Outfit", system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { min-height:100%; background:var(--void); color:var(--text); font-family:var(--ff-b); }

.splash-container {
  display:flex; flex-direction:column; align-items:center;
  justify-content:space-between; min-height:100vh;
  padding:calc(var(--sat) + 50px) 24px calc(var(--sab) + 34px);
  background:linear-gradient(160deg,#0D0B1E 0%,#1A1535 50%,#131029 100%);
  position:relative; overflow:hidden;
}
.splash-container::before {
  content:""; position:absolute; top:40%; left:50%;
  transform:translate(-50%,-50%);
  width:420px; height:420px;
  background:radial-gradient(circle, rgba(155,114,245,0.18) 0%, transparent 70%);
  filter:blur(60px); z-index:0; pointer-events:none;
}
.splash-container::after {
  content:""; position:absolute; bottom:20%; right:10%;
  width:250px; height:250px;
  background:radial-gradient(circle, rgba(212,168,32,0.08) 0%, transparent 70%);
  filter:blur(40px); z-index:0; pointer-events:none;
}

/* Lang switcher */
.lang-bar {
  display:flex; align-items:center; gap:10px; z-index:10;
  background:rgba(33,27,66,0.8); border:1px solid var(--stroke2);
  border-radius:40px; padding:6px 12px;
  backdrop-filter:blur(12px);
}
.lang-flag {
  font-size:26px; cursor:pointer; border-radius:50%;
  padding:4px 6px; transition:all .25s;
  border:2px solid transparent; line-height:1;
}
.lang-flag.active {
  border-color:var(--violet);
  background:rgba(155,114,245,0.15);
  transform:scale(1.15);
}
.lang-sep { width:1px; height:20px; background:var(--stroke2); }

/* Top nav */
.top-nav {
  display:flex; justify-content:space-between; align-items:center;
  width:100%; z-index:10; margin-bottom:16px;
}
.switch-btn {
  display:flex; align-items:center; gap:8px; padding:9px 18px;
  background:rgba(33,27,66,0.8); border:1px solid var(--stroke2);
  border-radius:30px; color:var(--text); font-family:var(--ff-b);
  font-weight:700; font-size:13px; cursor:pointer;
  text-decoration:none; transition:all .3s;
  backdrop-filter:blur(12px);
}
.switch-btn.admin { color:var(--violet); }
.switch-btn:hover { background:rgba(42,34,84,0.9); transform:translateY(-2px); }

/* Logo section */
.logo-section {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; flex:1; z-index:2; text-align:center;
  padding:16px 0;
}
.splash-logo {
  width:110px; height:110px; border-radius:26px;
  background:linear-gradient(135deg, var(--violet), var(--violet2));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--ff-s); font-size:64px; font-weight:700; color:white;
  box-shadow:0 16px 48px rgba(155,114,245,0.50), 0 0 0 1px rgba(155,114,245,0.20);
  margin-bottom:24px;
  animation:splPop .6s cubic-bezier(.34,1.56,.64,1) both, pulseGlow 3s ease-in-out 1s infinite;
}
@keyframes splPop { from{opacity:0;transform:scale(.7)} to{opacity:1;transform:none} }
@keyframes pulseGlow {
  0%,100%{box-shadow:0 16px 48px rgba(155,114,245,0.50);}
  50%{box-shadow:0 16px 64px rgba(155,114,245,0.75),0 0 80px rgba(155,114,245,0.15);}
}
.splash-name {
  font-family:var(--ff-s); font-size:44px; font-weight:700;
  background:linear-gradient(135deg, #C4B0FF, var(--violet), var(--gold-pale));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom:10px; letter-spacing:1px;
  animation:fadeUp .8s .3s both;
}
.splash-sub {
  font-size:14px; color:var(--text2); margin-bottom:24px;
  animation:fadeUp .8s .5s both;
}
.flags-row {
  display:flex; gap:18px; margin-bottom:8px; font-size:30px;
  animation:fadeUp .8s .7s both;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }

/* Decorative line like the poster */
.deco-line {
  display:flex; align-items:center; gap:12px;
  margin-bottom:20px; animation:fadeUp .8s .6s both;
}
.deco-line::before, .deco-line::after {
  content:""; flex:1; height:1px;
  background:linear-gradient(90deg, transparent, rgba(155,114,245,0.5), transparent);
}
.deco-text {
  font-size:10px; font-weight:700; color:var(--text3);
  letter-spacing:3px; text-transform:uppercase;
}

/* Actions */
.actions {
  display:flex; flex-direction:column; gap:10px;
  width:100%; max-width:400px; z-index:2;
}
.btn-primary {
  padding:17px 24px;
  background:linear-gradient(135deg, var(--violet), var(--violet2));
  color:white; border:none; border-radius:18px;
  font-family:var(--ff-b); font-size:15px; font-weight:700;
  cursor:pointer; text-decoration:none; text-align:center;
  box-shadow:0 16px 40px rgba(155,114,245,0.40);
  transition:all .3s; display:block;
}
.btn-primary:hover { transform:translateY(-3px); box-shadow:0 20px 52px rgba(155,114,245,0.55); }

.btn-secondary {
  padding:17px 24px;
  background:rgba(33,27,66,0.8); color:var(--sky);
  border:1px solid var(--stroke2); border-radius:18px;
  font-family:var(--ff-b); font-size:14px; font-weight:600;
  cursor:pointer; text-decoration:none; text-align:center;
  transition:all .3s; display:block; backdrop-filter:blur(8px);
}
.btn-secondary:hover { background:rgba(42,34,84,0.9); transform:translateY(-2px); }

.btn-demo {
  padding:14px 24px;
  background:transparent; color:var(--gold);
  border:1.5px solid rgba(212,168,32,0.5); border-radius:18px;
  font-family:var(--ff-b); font-size:14px; font-weight:600;
  cursor:pointer; text-decoration:none; text-align:center;
  transition:all .3s; display:flex; align-items:center;
  justify-content:center; gap:8px; margin-top:4px;
}
.btn-demo:hover { background:rgba(212,168,32,0.08); transform:translateY(-2px); }
.btn-demo .badge {
  background:var(--gold); color:var(--void);
  font-size:10px; font-weight:700; padding:2px 8px;
  border-radius:10px;
}

/* Website link button */
.btn-website {
  padding:14px 24px;
  background:transparent; color:var(--violet);
  border:1.5px solid rgba(155,114,245,0.5); border-radius:18px;
  font-family:var(--ff-b); font-size:14px; font-weight:600;
  cursor:pointer; text-decoration:none; text-align:center;
  transition:all .3s; display:flex; align-items:center;
  justify-content:center; gap:8px;
}
.btn-website:hover { background:rgba(155,114,245,0.08); transform:translateY(-2px); }

.divider {
  display:flex; align-items:center; gap:12px; margin:6px 0 2px;
  color:var(--text3); font-size:11px; text-transform:uppercase;
  letter-spacing:1.2px; font-weight:700;
}
.divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--stroke); }

/* NETWORKING badge like the poster */
.event-badge {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(155,114,245,0.10); border:1px solid rgba(155,114,245,0.30);
  border-radius:6px; padding:6px 16px; margin-bottom:14px;
  font-size:11px; font-weight:700; color:var(--violet);
  letter-spacing:2px; text-transform:uppercase;
  animation:fadeUp .8s .25s both;
}
</style>
</head>
<body>
<div class="splash-container">

  <!-- TOP NAV -->
  <div class="top-nav">
    <div class="lang-bar">
      <span class="lang-flag active" id="flag-fr" onclick="setLang('fr')">🇫🇷</span>
      <div class="lang-sep"></div>
      <span class="lang-flag" id="flag-en" onclick="setLang('en')">🇬🇧</span>
    </div>
    <div style="display:flex;gap:10px;">
      <a href="./index.html" class="switch-btn">📱 Mobile</a>
      <a href="./admin.html" class="switch-btn admin">💻 Admin</a>
    </div>
  </div>

  <!-- LOGO -->
  <div class="logo-section">
    <div class="event-badge">✦ Fintech · Diaspora · Tontine</div>
    <div class="splash-logo">N</div>
    <h1 class="splash-name">NEO-SUSU</h1>

    <div class="deco-line">
      <span class="deco-text" data-fr="epargne · communaute · intelligence" data-en="savings · community · intelligence">epargne · communaute · intelligence</span>
    </div>

    <p class="splash-sub">
      <span data-fr="L'epargne communautaire intelligente 🌍" data-en="Intelligent community savings 🌍">
        L'epargne communautaire intelligente 🌍
      </span>
    </p>

    <div class="flags-row">
      <span>🇫🇷</span><span>🇸🇳</span><span>🇳🇬</span><span>🇨🇮</span><span>🇨🇩</span><span>🇬🇧</span>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">
    <a href="./signup.html" class="btn-primary">
      <span data-fr="Commencer — C'est gratuit ✦" data-en="Get started — It's free ✦">Commencer — C'est gratuit ✦</span>
    </a>

    <a href="./login.html" class="btn-secondary">
      <span data-fr="Deja membre ? Se connecter" data-en="Already a member? Sign in">Deja membre ? Se connecter</span>
    </a>

    <div class="divider"><span data-fr="ou" data-en="or">ou</span></div>

    <a href="./dashboard.html?mode=demo" class="btn-demo" id="demoBtn">
      <span>👁️ <span data-fr="Decouvrir sans compte" data-en="Explore without account">Decouvrir sans compte</span></span>
      <span class="badge">DEMO</span>
    </a>

    <a href="https://lolaronke.github.io/neo-susu/neo-susu-website.html" target="_blank" class="btn-website">
      🌐 <span data-fr="Voir le site officiel" data-en="Visit official website">Voir le site officiel</span>
    </a>
  </div>

</div>

<script>
let currentLang = localStorage.getItem('ns_lang') || 'fr';
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('ns_lang', lang);
  document.getElementById('html-root').lang = lang;
  document.title = lang === 'en'
    ? "NEO-SUSU — Intelligent community savings"
    : "NEO-SUSU — L'epargne communautaire intelligente";
  document.querySelectorAll('[data-fr]').forEach(el => {
    const v = el.getAttribute('data-' + lang);
    if (v) el.textContent = v;
  });
  document.getElementById('flag-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('flag-en').classList.toggle('active', lang === 'en');
}
setLang(currentLang);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

document.getElementById('demoBtn').addEventListener('click', function() {
  sessionStorage.setItem('neo_susu_demo_user', JSON.stringify({
    id: 'demo-' + Date.now(),
    first_name: currentLang === 'en' ? 'Visitor' : 'Visiteur',
    last_name: 'Demo', email: 'demo@neo-susu.com',
    is_demo: true, lang: currentLang
  }));
});
</script>
</body>
</html>
