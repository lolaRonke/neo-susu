<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEO-SUSU — L'épargne communautaire intelligente</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<!-- Polices Google -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --void: #000000;
    --gold: #D4AF37;
    --gold-light: #F4D03F;
    --gold-glow: rgba(212, 175, 55, 0.4);
    --text-light: #F5F5F5;
    --text-dim: #B0B0B0;
    --blue-accent: #4FC3F7;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    min-height: 100%;
    background: var(--void) !important;
    color: var(--text-light) !important;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  .splash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    padding: 50px 24px 30px;
    background: var(--void);
    position: relative;
    overflow: hidden;
  }

  .splash-container::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
    filter: blur(60px);
    z-index: 0;
    pointer-events: none;
  }

  /* Boutons du haut Mobile/Admin */
  .top-switcher {
    display: flex;
    gap: 12px;
    z-index: 2;
    margin-bottom: 20px;
  }

  .switch-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 30px;
    color: var(--text-light) !important;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .switch-btn.admin {
    color: var(--blue-accent) !important;
  }

  .switch-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
  }

  /* Logo central doré */
  .logo-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    z-index: 2;
    text-align: center;
    padding: 20px 0;
  }

  .logo-icon {
    width: 110px;
    height: 110px;
    background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 50%, #D4AF37 100%) !important;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 66px;
    font-weight: 800;
    color: var(--void) !important;
    box-shadow:
      0 0 40px rgba(212, 175, 55, 0.6),
      0 0 80px rgba(212, 175, 55, 0.3),
      inset 0 2px 4px rgba(255, 255, 255, 0.3);
    margin-bottom: 24px;
    animation: pulse-glow 3s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.6), 0 0 80px rgba(212, 175, 55, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.3); }
    50% { box-shadow: 0 0 60px rgba(212, 175, 55, 0.8), 0 0 100px rgba(212, 175, 55, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4); }
  }

  .app-title {
    font-family: 'Syne', sans-serif;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 50%, #D4AF37 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    color: #D4AF37 !important;
    margin-bottom: 10px;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
  }

  .app-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--text-light) !important;
    opacity: 0.9;
    margin-bottom: 24px;
    letter-spacing: 0.3px;
  }

  .flags-row {
    display: flex;
    gap: 18px;
    margin-bottom: 10px;
    font-size: 30px;
  }

  .flags-row span {
    transition: transform 0.3s ease;
    cursor: pointer;
  }

  .flags-row span:hover {
    transform: scale(1.2);
  }

  /* Boutons d'action */
  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 400px;
    z-index: 2;
  }

  .btn-primary {
    padding: 17px 24px;
    background: linear-gradient(135deg, #FFFFFF 0%, #F5F5F5 100%) !important;
    color: var(--void) !important;
    border: none;
    border-radius: 50px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4), 0 0 60px rgba(212, 175, 55, 0.2);
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5), 0 0 80px rgba(212, 175, 55, 0.3);
  }

  .btn-secondary {
    padding: 17px 24px;
    background: #FFFFFF !important;
    color: var(--blue-accent) !important;
    border: none;
    border-radius: 50px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: all 0.3s ease;
  }

  .btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79, 195, 247, 0.3);
  }

  /* NOUVEAU : Bouton mode démo */
  .btn-demo {
    padding: 14px 24px;
    background: transparent !important;
    color: var(--gold) !important;
    border: 1.5px solid var(--gold);
    border-radius: 50px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
  }

  .btn-demo:hover {
    background: rgba(212, 175, 55, 0.1) !important;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
  }

  .btn-demo .badge {
    background: var(--gold);
    color: var(--void);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.5px;
  }

  /* Séparateur OU */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0 4px;
    color: var(--text-dim);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
  }

  @media (max-width: 380px) {
    .app-title { font-size: 38px; }
    .logo-icon { width: 95px; height: 95px; font-size: 56px; }
    .flags-row { gap: 14px; font-size: 26px; }
  }

  .logo-section > * {
    opacity: 0;
    animation: fadeInUp 0.8s ease forwards;
  }

  .logo-icon { animation-delay: 0.1s; }
  .app-title { animation-delay: 0.3s; }
  .app-subtitle { animation-delay: 0.5s; }
  .flags-row { animation-delay: 0.7s; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="splash-container">

  <!-- Boutons du haut : Mobile / Admin -->
  <div class="top-switcher">
    <a href="./index.html" class="switch-btn">📱 Mobile</a>
    <a href="./admin.html" class="switch-btn admin">💻 Admin</a>
  </div>

  <!-- Section centrale : logo + titre -->
  <div class="logo-section">
    <div class="logo-icon">N</div>
    <h1 class="app-title">NEO-SUSU</h1>
    <p class="app-subtitle">L'épargne communautaire intelligente 🌍</p>

    <div class="flags-row">
      <span title="France">🇫🇷</span>
      <span title="Sénégal">🇸🇳</span>
      <span title="Nigeria">🇳🇬</span>
      <span title="Côte d'Ivoire">🇨🇮</span>
      <span title="RD Congo">🇨🇩</span>
    </div>
  </div>

  <!-- Boutons d'action en bas -->
  <div class="actions">
    <a href="./signup.html" class="btn-primary">
      Commencer — C'est gratuit ✦
    </a>

    <a href="./login.html" class="btn-secondary">
      Déjà membre ? Se connecter
    </a>

    <div class="divider">ou</div>

    <!-- NOUVEAU : Accès direct sans compte -->
    <a href="./dashboard.html?mode=demo" class="btn-demo" id="demoBtn">
      <span>👁️ Découvrir l'app sans compte</span>
      <span class="badge">DÉMO</span>
    </a>
  </div>

</div>

<script>
  // Service Worker pour PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW enregistré'))
        .catch(err => console.log('SW erreur:', err));
    });
  }

  // Mode démo : crée une session locale sans Supabase
  document.getElementById('demoBtn').addEventListener('click', function(e) {
    const demoUser = {
      id: 'demo-user-' + Date.now(),
      first_name: 'Visiteur',
      last_name: 'Démo',
      email: 'demo@neo-susu.com',
      country: '🌍',
      is_demo: true,
      created_at: new Date().toISOString()
    };
    sessionStorage.setItem('neo_susu_demo_user', JSON.stringify(demoUser));
    console.log('Mode démo activé');
  });
</script>

</body>
</html>
