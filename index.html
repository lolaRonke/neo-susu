<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A1612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEO-SUSU — L'épargne communautaire intelligente</title>

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --void: #1A1612;
    --deep: #221E18;
    --surf: #2A2520;
    --card: #332E26;
    --raised: #3D372E;
    --gold: #C8920A;
    --gold2: #A07208;
    --gold-pale: #EEC86A;
    --em: #C4956A;
    --red: #CC4848;
    --sky: #B0A898;
    --text: #EDE8E0;
    --text2: #9C9080;
    --text3: #655E54;
    --stroke: rgba(237,232,224,0.07);
    --stroke2: rgba(237,232,224,0.13);
    --ff-s: "Cormorant Garamond", serif;
    --ff-b: "Outfit", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    min-height: 100%;
    background: var(--void) !important;
    color: var(--text) !important;
    font-family: var(--ff-b);
  }

  .splash-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    padding: 50px 24px 30px;
    background: var(--void);
    position: relative;
    overflow: hidden;
  }

  .splash-container::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(200,146,10,0.25) 0%, transparent 70%);
    filter: blur(60px);
    z-index: 0;
    pointer-events: none;
  }

  .top-switcher {
    display: flex;
    gap: 12px;
    z-index: 2;
    margin-bottom: 20px;
  }

  .switch-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--card);
    border: 1px solid var(--stroke2);
    border-radius: 30px;
    color: var(--text) !important;
    font-family: var(--ff-b);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .switch-btn.admin { color: var(--sky) !important; }

  .switch-btn:hover {
    background: var(--raised);
    transform: translateY(-2px);
  }

  .logo-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    z-index: 2;
    text-align: center;
    padding: 20px 0;
  }

  .splash-logo {
    width: 110px;
    height: 110px;
    border-radius: 26px;
    background: linear-gradient(135deg, var(--gold), var(--gold2)) !important;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--ff-s);
    font-size: 64px;
    font-weight: 700;
    color: var(--void) !important;
    box-shadow: 0 16px 48px rgba(200,146,10,0.45);
    margin-bottom: 24px;
    animation: pulse-glow 3s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 16px 48px rgba(200,146,10,0.45); }
    50% { box-shadow: 0 16px 60px rgba(200,146,10,0.65); }
  }

  .splash-name {
    font-family: var(--ff-s);
    font-size: 44px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--gold-pale), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    color: var(--gold) !important;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  .splash-sub {
    font-family: var(--ff-b);
    font-size: 14px;
    font-weight: 400;
    color: var(--text2) !important;
    margin-bottom: 24px;
    letter-spacing: 0.3px;
  }

  .flags-row {
    display: flex;
    gap: 18px;
    margin-bottom: 10px;
    font-size: 30px;
  }

  .flags-row span {
    transition: transform 0.3s ease;
    cursor: pointer;
  }

  .flags-row span:hover { transform: scale(1.2); }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 400px;
    z-index: 2;
  }

  .btn-primary {
    padding: 17px 24px;
    background: linear-gradient(135deg, var(--gold-pale) 0%, var(--gold) 100%) !important;
    color: var(--void) !important;
    border: none;
    border-radius: 18px;
    font-family: var(--ff-b);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    box-shadow: 0 16px 48px rgba(200,146,10,0.45);
    transition: all 0.3s ease;
    letter-spacing: 0.3px;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 60px rgba(200,146,10,0.55);
  }

  .btn-secondary {
    padding: 17px 24px;
    background: var(--card) !important;
    color: var(--sky) !important;
    border: 1px solid var(--stroke2);
    border-radius: 18px;
    font-family: var(--ff-b);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: all 0.3s ease;
  }

  .btn-secondary:hover {
    background: var(--raised);
    transform: translateY(-2px);
  }

  .btn-demo {
    padding: 14px 24px;
    background: transparent !important;
    color: var(--gold) !important;
    border: 1.5px solid var(--gold);
    border-radius: 18px;
    font-family: var(--ff-b);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
  }

  .btn-demo:hover {
    background: rgba(200,146,10,0.08) !important;
    transform: translateY(-2px);
  }

  .btn-demo .badge {
    background: var(--gold);
    color: var(--void);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.5px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0 4px;
    color: var(--text3);
    font-size: 11px;
    font-family: var(--ff-b);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 700;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--stroke);
  }

  @media (max-width: 380px) {
    .splash-name { font-size: 38px; }
    .splash-logo { width: 95px; height: 95px; font-size: 56px; }
    .flags-row { gap: 14px; font-size: 26px; }
  }

  .logo-section > * {
    opacity: 0;
    animation: fadeInUp 0.8s ease forwards;
  }

  .splash-logo { animation: splPop 0.6s cubic-bezier(.34,1.56,.64,1) both, pulse-glow 3s ease-in-out 1s infinite; }
  .splash-name { animation-delay: 0.3s; }
  .splash-sub { animation-delay: 0.5s; }
  .flags-row { animation-delay: 0.7s; }

  @keyframes splPop {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="splash-container">

  <div class="top-switcher">
    <a href="./index.html" class="switch-btn">📱 Mobile</a>
    <a href="./admin.html" class="switch-btn admin">💻 Admin</a>
  </div>

  <div class="logo-section">
    <div class="splash-logo">N</div>
    <h1 class="splash-name">NEO-SUSU</h1>
    <p class="splash-sub">L'épargne communautaire intelligente 🌍</p>

    <div class="flags-row">
      <span title="France">🇫🇷</span>
      <span title="Sénégal">🇸🇳</span>
      <span title="Nigeria">🇳🇬</span>
      <span title="Côte d'Ivoire">🇨🇮</span>
      <span title="RD Congo">🇨🇩</span>
    </div>
  </div>

  <div class="actions">
    <a href="./signup.html" class="btn-primary">
      Commencer — C'est gratuit ✦
    </a>

    <a href="./login.html" class="btn-secondary">
      Déjà membre ? Se connecter
    </a>

    <div class="divider">ou</div>

    <a href="./dashboard.html?mode=demo" class="btn-demo" id="demoBtn">
      <span>👁️ Découvrir l'app sans compte</span>
      <span class="badge">DÉMO</span>
    </a>
  </div>

</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  document.getElementById('demoBtn').addEventListener('click', function() {
    const demoUser = {
      id: 'demo-user-' + Date.now(),
      first_name: 'Visiteur',
      last_name: 'Démo',
      email: 'demo@neo-susu.com',
      is_demo: true
    };
    sessionStorage.setItem('neo_susu_demo_user', JSON.stringify(demoUser));
  });
</script>

</body>
</html>
