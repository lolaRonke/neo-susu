<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO-SUSU — Créer mon compte</title>
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --void: #000000; --deep: #1a1a2e; --gold: #D4AF37; --gold-light: #F4D03F; --text-light: #F5F5F5; --text-dim: #B0B0B0; --green: #10b981; --blue-accent: #4FC3F7; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: radial-gradient(ellipse at top, var(--deep) 0%, var(--void) 70%); color: var(--text-light); min-height: 100vh; padding: 30px 20px 60px; }
  .container { max-width: 460px; margin: 0 auto; }
  .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 14px; margin-bottom: 24px; }
  .logo-section { text-align: center; margin-bottom: 30px; }
  .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 42px; font-weight: 800; color: var(--void); margin: 0 auto 16px; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); }
  .page-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--gold); margin-bottom: 6px; }
  .page-subtitle { color: var(--text-dim); font-size: 14px; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; }
  input, select { width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; color: var(--text-light); font-family: 'Inter', sans-serif; font-size: 15px; }
  input:focus, select:focus { outline: none; border-color: var(--gold); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-submit { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); color: var(--void); border: none; border-radius: 50px; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; }
  .login-link { text-align: center; margin-top: 20px; color: var(--text-dim); font-size: 14px; }
  .login-link a { color: var(--blue-accent); text-decoration: none; font-weight: 600; }
  .info-box { background: rgba(212, 175, 55, 0.08); border-left: 3px solid var(--gold); padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 13px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="container">
  <a href="./index.html" class="back-link">← Retour</a>

  <div class="logo-section">
    <div class="logo-icon">N</div>
    <h1 class="page-title">Créer mon compte</h1>
    <p class="page-subtitle">Rejoins NEO-SUSU en 1 minute</p>
  </div>

  <div class="info-box">
    🔧 <strong>Configuration en cours</strong> — La création de compte sera bientôt connectée à la base de données.
  </div>

  <form id="signupForm">
    <div class="row">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" id="firstName" placeholder="Aïcha" required>
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="lastName" placeholder="Diallo" required>
      </div>
    </div>

    <div class="form-group">
      <label>Pays</label>
      <select id="country" required>
        <option value="">Sélectionner</option>
        <option value="SN">🇸🇳 Sénégal</option>
        <option value="CI">🇨🇮 Côte d'Ivoire</option>
        <option value="NG">🇳🇬 Nigeria</option>
        <option value="CD">🇨🇩 RD Congo</option>
        <option value="FR">🇫🇷 France</option>
      </select>
    </div>

    <div class="form-group">
      <label>Téléphone</label>
      <input type="tel" id="phone" placeholder="+221 77 123 45 67" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="ton@email.com" required>
    </div>

    <div class="form-group">
      <label>Mot de passe (min. 8 caractères)</label>
      <input type="password" id="password" placeholder="••••••••" minlength="8" required>
    </div>

    <button type="submit" class="btn-submit">Créer mon compte ✦</button>
  </form>

  <div class="login-link">
    Déjà un compte ? <a href="./login.html">Se connecter</a>
  </div>
</div>

<script>
  document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('🔧 La création de compte sera activée une fois Supabase configuré.\n\nEn attendant, tu peux utiliser le mode démo depuis l\'accueil.');
    window.location.href = './index.html';
  });
</script>
</body>
</html>
