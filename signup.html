<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080F">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>NEO-SUSU — Creer mon compte</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
<style>.container{max-width:460px;}.logo-section{text-align:center;margin-bottom:30px;}</style>

<style>
.lang-bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--stroke2);border-radius:40px;padding:5px 10px;position:fixed;top:16px;right:16px;z-index:200;}
.lang-flag{font-size:22px;cursor:pointer;border-radius:50%;padding:3px 5px;transition:all .25s;border:2px solid transparent;line-height:1;}
.lang-flag.active{border-color:var(--gold);background:rgba(212,168,32,.12);transform:scale(1.12);}
.lang-sep{width:1px;height:16px;background:var(--stroke2);}
</style>
</head>
<body>

<div class="lang-bar">
  <span class="lang-flag active" id="flag-fr" onclick="setLang('fr')" title="Francais">🇫🇷</span>
  <div class="lang-sep"></div>
  <span class="lang-flag" id="flag-en" onclick="setLang('en')" title="English">🇬🇧</span>
</div>
<div class="container">
  <a href="./index.html" class="back-link" data-fr="← Retour" data-en="← Back">← Retour</a>
  <div class="logo-section">
    <div class="logo-icon">N</div>
    <h1 class="page-title" data-fr="Creer mon compte" data-en="Create my account">Creer mon compte</h1>
    <p class="page-subtitle" data-fr="Rejoins NEO-SUSU en 1 minute" data-en="Join NEO-SUSU in 1 minute">Rejoins NEO-SUSU en 1 minute</p>
  </div>
  <div class="info-box">
    🔧 <strong data-fr="Configuration en cours" data-en="Setup in progress">Configuration en cours</strong> —
    <span data-fr="La creation de compte sera bientot disponible." data-en="Account creation will be available soon.">La creation de compte sera bientot disponible.</span>
  </div>
  <form id="signupForm">
    <div class="row">
      <div class="form-group"><label data-fr="Prenom" data-en="First name">Prenom</label><input type="text" id="firstName" placeholder="Aicha" required></div>
      <div class="form-group"><label data-fr="Nom" data-en="Last name">Nom</label><input type="text" id="lastName" placeholder="Diallo" required></div>
    </div>
    <div class="form-group">
      <label data-fr="Pays" data-en="Country">Pays</label>
      <select id="country" required>
        <option value="" data-fr="Selectionner" data-en="Select">Selectionner</option>
        <option value="SN">🇸🇳 Senegal</option>
        <option value="CI">🇨🇮 Cote d\'Ivoire</option>
        <option value="NG">🇳🇬 Nigeria</option>
        <option value="CD">🇨🇩 RD Congo</option>
        <option value="FR">🇫🇷 France</option>
        <option value="GB">🇬🇧 United Kingdom</option>
      </select>
    </div>
    <div class="form-group"><label data-fr="Telephone" data-en="Phone">Telephone</label><input type="tel" id="phone" placeholder="+221 77 123 45 67" required></div>
    <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@email.com" required></div>
    <div class="form-group">
      <label data-fr="Mot de passe (min. 8 caracteres)" data-en="Password (min. 8 characters)">Mot de passe (min. 8 caracteres)</label>
      <input type="password" id="password" placeholder="••••••••" minlength="8" required>
    </div>
    <button type="submit" class="btn-submit" data-fr="Creer mon compte" data-en="Create my account">Creer mon compte ✦</button>
  </form>
  <div class="login-link">
    <span data-fr="Deja un compte ?" data-en="Already have an account?">Deja un compte ?</span>
    <a href="./login.html" data-fr="Se connecter" data-en="Sign in">Se connecter</a>
  </div>
</div>
<script>
document.getElementById("signupForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const msg = currentLang === "en"
    ? "Account creation will be activated once Supabase is configured.\nUse demo mode from the home page."
    : "La creation de compte sera activee une fois Supabase configure.\nUtilise le mode demo depuis l\'accueil.";
  alert("🔧 " + msg);
  window.location.href = "./index.html";
});
</script>

<script>
let currentLang = localStorage.getItem("ns_lang") || "fr";
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("ns_lang", lang);
  document.getElementById("html-root").lang = lang;
  document.querySelectorAll("[data-fr]").forEach(el => {
    const val = el.getAttribute("data-" + lang);
    if (val) el.textContent = val;
  });
  const fFr = document.getElementById("flag-fr");
  const fEn = document.getElementById("flag-en");
  if(fFr) fFr.classList.toggle("active", lang === "fr");
  if(fEn) fEn.classList.toggle("active", lang === "en");
}
setLang(currentLang);
</script>
</body>
</html>
