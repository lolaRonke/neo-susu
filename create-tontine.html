<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO-SUSU — Créer une tontine</title>
<meta name="theme-color" content="#07080F">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">
</head>
<body>
<div class="container">
  <a href="./dashboard.html" class="back-link">← Retour au tableau de bord</a>

  <h1 class="page-title">Créer une tontine</h1>
  <p class="page-subtitle">Configure ta tontine en quelques étapes</p>

  <div class="info-box">
    💡 <strong>Mode démo</strong> — Cette tontine ne sera pas réellement enregistrée. Crée un vrai compte pour gérer de vraies tontines.
  </div>

  <form id="tontineForm">
    <div class="form-group">
      <label>Nom de la tontine</label>
      <input type="text" id="name" placeholder="Ex : Tontine Famille Diallo" required>
    </div>

    <div class="form-group">
      <label>Description (optionnel)</label>
      <textarea id="description" placeholder="À quoi sert cette tontine ?"></textarea>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Montant par membre</label>
        <input type="number" id="amount" placeholder="25 000" required>
      </div>
      <div class="form-group">
        <label>Devise</label>
        <select id="currency">
          <option value="XOF">FCFA (XOF)</option>
          <option value="XAF">FCFA (XAF)</option>
          <option value="NGN">Naira (NGN)</option>
          <option value="EUR">Euro (EUR)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Fréquence</label>
        <select id="frequency">
          <option value="weekly">Hebdomadaire</option>
          <option value="biweekly">Bimensuelle</option>
          <option value="monthly" selected>Mensuelle</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nb max membres</label>
        <input type="number" id="maxMembers" placeholder="10" min="2" max="50" value="10" required>
      </div>
    </div>

    <div class="form-group">
      <label>Date de début</label>
      <input type="date" id="startDate" required>
    </div>

    <button type="submit" class="btn-submit">Créer la tontine ✦</button>
  </form>

  <div class="success-msg" id="successMsg">
    ✅ <strong>Tontine créée avec succès !</strong><br>
    <small style="font-weight: 400; opacity: 0.8;">Redirection vers le tableau de bord...</small>
  </div>
</div>

<script>
  document.getElementById('startDate').valueAsDate = new Date();
  document.getElementById('tontineForm').addEventListener('submit', function(e) {
    e.preventDefault();
    document.getElementById('successMsg').classList.add('active');
    setTimeout(() => { window.location.href = './dashboard.html'; }, 2000);
  });
</script>
</body>
</html>
