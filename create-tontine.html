<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080F">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>NEO-SUSU — Creer une tontine</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neo-susu.css">

<style>
.lang-bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--stroke2);border-radius:40px;padding:5px 10px;position:fixed;top:16px;right:16px;z-index:200;}
.lang-flag{font-size:22px;cursor:pointer;border-radius:50%;padding:3px 5px;transition:all .25s;border:2px solid transparent;line-height:1;}
.lang-flag.active{border-color:var(--gold);background:rgba(212,168,32,.12);transform:scale(1.12);}
.lang-sep{width:1px;height:16px;background:var(--stroke2);}
</style>
</head>
<body>

<div class="lang-bar">
  <span class="lang-flag active" id="flag-fr" onclick="setLang('fr')" title="Francais">🇫🇷</span>
  <div class="lang-sep"></div>
  <span class="lang-flag" id="flag-en" onclick="setLang('en')" title="English">🇬🇧</span>
</div>
<div class="container">
  <a href="./dashboard.html" class="back-link" data-fr="← Retour au tableau de bord" data-en="← Back to dashboard">← Retour au tableau de bord</a>
  <h1 class="page-title" data-fr="Creer une tontine" data-en="Create a tontine">Creer une tontine</h1>
  <p class="page-subtitle" data-fr="Configure ta tontine en quelques etapes" data-en="Set up your tontine in a few steps">Configure ta tontine en quelques etapes</p>
  <div class="info-box">
    💡 <strong data-fr="Mode demo" data-en="Demo mode">Mode demo</strong> —
    <span data-fr="Cette tontine ne sera pas reellement enregistree." data-en="This tontine will not be actually saved.">Cette tontine ne sera pas reellement enregistree.</span>
  </div>
  <form id="tontineForm">
    <div class="form-group">
      <label data-fr="Nom de la tontine" data-en="Tontine name">Nom de la tontine</label>
      <input type="text" id="name" placeholder="Ex: Tontine Famille Diallo" required>
    </div>
    <div class="form-group">
      <label data-fr="Description (optionnel)" data-en="Description (optional)">Description (optionnel)</label>
      <textarea id="description" placeholder="..."></textarea>
    </div>
    <div class="row">
      <div class="form-group">
        <label data-fr="Montant par membre" data-en="Amount per member">Montant par membre</label>
        <input type="number" id="amount" placeholder="25 000" required>
      </div>
      <div class="form-group">
        <label data-fr="Devise" data-en="Currency">Devise</label>
        <select id="currency">
          <option value="XOF">FCFA (XOF)</option>
          <option value="XAF">FCFA (XAF)</option>
          <option value="NGN">Naira (NGN)</option>
          <option value="EUR">Euro (EUR)</option>
          <option value="GBP">Pound (GBP)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label data-fr="Frequence" data-en="Frequency">Frequence</label>
        <select id="frequency">
          <option value="weekly" data-fr="Hebdomadaire" data-en="Weekly">Hebdomadaire</option>
          <option value="biweekly" data-fr="Bimensuelle" data-en="Biweekly">Bimensuelle</option>
          <option value="monthly" selected data-fr="Mensuelle" data-en="Monthly">Mensuelle</option>
        </select>
      </div>
      <div class="form-group">
        <label data-fr="Nb max membres" data-en="Max members">Nb max membres</label>
        <input type="number" id="maxMembers" placeholder="10" min="2" max="50" value="10" required>
      </div>
    </div>
    <div class="form-group">
      <label data-fr="Date de debut" data-en="Start date">Date de debut</label>
      <input type="date" id="startDate" required>
    </div>
    <button type="submit" class="btn-submit" data-fr="Creer la tontine" data-en="Create tontine">Creer la tontine ✦</button>
  </form>
  <div class="success-msg" id="successMsg">
    <span data-fr="Tontine creee avec succes ! Redirection..." data-en="Tontine created successfully! Redirecting...">✅ Tontine creee avec succes ! Redirection...</span>
  </div>
</div>
<script>
document.getElementById("startDate").valueAsDate = new Date();
document.getElementById("tontineForm").addEventListener("submit", function(e) {
  e.preventDefault();
  document.getElementById("successMsg").classList.add("active");
  setTimeout(() => { window.location.href = "./dashboard.html"; }, 2000);
});
</script>

<script>
let currentLang = localStorage.getItem("ns_lang") || "fr";
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("ns_lang", lang);
  document.getElementById("html-root").lang = lang;
  document.querySelectorAll("[data-fr]").forEach(el => {
    const val = el.getAttribute("data-" + lang);
    if (val) el.textContent = val;
  });
  const fFr = document.getElementById("flag-fr");
  const fEn = document.getElementById("flag-en");
  if(fFr) fFr.classList.toggle("active", lang === "fr");
  if(fEn) fEn.classList.toggle("active", lang === "en");
}
setLang(currentLang);
</script>
</body>
</html>
