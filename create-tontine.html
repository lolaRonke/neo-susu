<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO-SUSU — Créer une tontine</title>
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --void: #000000; --deep: #1a1a2e; --gold: #D4AF37; --gold-light: #F4D03F; --text-light: #F5F5F5; --text-dim: #B0B0B0; --green: #10b981; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: radial-gradient(ellipse at top, var(--deep) 0%, var(--void) 70%); color: var(--text-light); min-height: 100vh; padding: 30px 20px 60px; }
  .container { max-width: 500px; margin: 0 auto; }
  .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 14px; margin-bottom: 24px; }
  .back-link:hover { color: var(--gold); }
  .page-title { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
  .page-subtitle { color: var(--text-dim); margin-bottom: 30px; font-size: 14px; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; }
  input, select, textarea { width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; color: var(--text-light); font-family: 'Inter', sans-serif; font-size: 15px; transition: all 0.3s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); background: rgba(255, 255, 255, 0.08); }
  textarea { resize: vertical; min-height: 80px; font-family: 'Inter', sans-serif; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-submit { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); color: var(--void); border: none; border-radius: 50px; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); }
  .btn-submit:hover { transform: translateY(-2px); }
  .success-msg { display: none; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--green); color: var(--green); padding: 16px; border-radius: 14px; text-align: center; margin-top: 16px; }
  .success-msg.active { display: block; }
  .info-box { background: rgba(212, 175, 55, 0.08); border-left: 3px solid var(--gold); padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 13px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="container">
  <a href="./dashboard.html" class="back-link">← Retour au tableau de bord</a>

  <h1 class="page-title">Créer une tontine</h1>
  <p class="page-subtitle">Configure ta tontine en quelques étapes</p>

  <div class="info-box">
    💡 <strong>Mode démo</strong> — Cette tontine ne sera pas réellement enregistrée. Crée un vrai compte pour gérer de vraies tontines.
  </div>

  <form id="tontineForm">
    <div class="form-group">
      <label>Nom de la tontine</label>
      <input type="text" id="name" placeholder="Ex: Tontine Famille Diallo" required>
    </div>

    <div class="form-group">
      <label>Description (optionnel)</label>
      <textarea id="description" placeholder="À quoi sert cette tontine ?"></textarea>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Montant par membre</label>
        <input type="number" id="amount" placeholder="25 000" required>
      </div>
      <div class="form-group">
        <label>Devise</label>
        <select id="currency">
          <option value="XOF">FCFA (XOF)</option>
          <option value="XAF">FCFA (XAF)</option>
          <option value="NGN">Naira (NGN)</option>
          <option value="EUR">Euro (EUR)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Fréquence</label>
        <select id="frequency">
          <option value="weekly">Hebdomadaire</option>
          <option value="biweekly">Bimensuelle</option>
          <option value="monthly" selected>Mensuelle</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nb max membres</label>
        <input type="number" id="maxMembers" placeholder="10" min="2" max="50" value="10" required>
      </div>
    </div>

    <div class="form-group">
      <label>Date de début</label>
      <input type="date" id="startDate" required>
    </div>

    <button type="submit" class="btn-submit">Créer la tontine ✦</button>
  </form>

  <div class="success-msg" id="successMsg">
    ✅ <strong>Tontine créée avec succès !</strong><br>
    <small>Redirection vers le tableau de bord...</small>
  </div>
</div>

<script>
  document.getElementById('startDate').valueAsDate = new Date();

  document.getElementById('tontineForm').addEventListener('submit', function(e) {
    e.preventDefault();
    document.getElementById('successMsg').classList.add('active');
    setTimeout(() => { window.location.href = './dashboard.html'; }, 2000);
  });
</script>
</body>
</html>
